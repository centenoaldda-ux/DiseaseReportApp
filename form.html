<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/2ba18a43cc.js" crossorigin="anonymous"></script>
    <script> function validateForm() {
            const diseaseType = document.getElementById("disease-type").value;
            const stateCode = document.getElementById("StateCode").value;
            const zipcode = document.getElementById("zipcode").value;
            const date = document.getElementById("date").value;
            const currentDate = new Date().toISOString().split("T")[0];

            const StateCodeList = ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", 
            "DE", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", 
            "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", 
            "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", 
            "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI","WY"];

            if (!diseaseType || !stateCode || !zipcode || !date) {
                alert("Please fill in all fields.");
                return false;

            } else if (stateCode && !StateCodeList.includes(stateCode.toUpperCase())) {
                alert("Please enter a valid state code.");
                return false;
                
            } else if (date > currentDate) {
                alert("Symptom start date can not be in the future.");
                return false;

            } else {

                return true;

            }
        }</script>
</head>
<body>
    <form id="disease-form">
        <h1>Disease Report</h1>
        <div class="input-wrapper">
            <i class="fa-solid fa-virus input-icon"></i>
            <select name="disease-type" id="disease-type">
                <option value="" disabled selected>Select Disease</option>
                <option value="flu">Flu</option>
                <option value="influenza">Cold</option>
                <option value="covid-19">Covid-19</option>
                <option value="norovirus">Norovirus</option>
                <option value="chickenpox">Chickenpox</option>
                <option value="ringworm">Ringworm</option>
                <option value="other">Other Contagious Diseases</option>
            </select>
        </div>
        <div class="input-wrapper">
            <i class="fa-solid fa-location-dot input-icon"></i>
            <input type="StateCode" 
                id="StateCode"
                placeholder="State Code (e.g. VA, NY, TX)"
                minlength="2"
                maxlength="2"
            >
        </div>
        <div class="input-wrapper">
            <i class="fa-solid fa-location-dot input-icon"></i>
            <input type="zipcode" 
                id="zipcode"
                placeholder="Zipcode"
                inputmode="numeric"
                pattern="[0-9]{5}"
                minlength="5"
                maxlength="5"
            >
        </div>
        <div class="input-wrapper">
            <i class="fa-solid fa-calendar-days input-icon"></i>
            <input type="date" id="date" placeholder="Date" >
        </div>
        <div class="input-wrapper">
            <i class="fa-solid fa-thermometer-half input-icon"></i>
            <textarea 
                placeholder="Write your experience" 
                rows="4" 
    
            ></textarea>
        </div>
         <div class="buttons">
            <button type="button" class="back-button">Go Back</button>
            <button type="submit" class="submit-button">Submit</button>
        </div>
        <div class="menu-container">
            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Open navigation menu"
                aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav class="menu-links" id="menu-links" hidden>
                <a href="./homepage.html">Homepage</a>
                <a href="./form.html">Submit Case</a>
                <a href="./pharmacies.html">Find Pharmacies</a>
            </nav>
        </div>
    </form>
    <script>
    const menuToggle = document.getElementById("menu-toggle");
    const menuLinks = document.getElementById("menu-links");

    menuToggle.addEventListener("click", function () {
        menuLinks.hidden = !menuLinks.hidden;

        menuToggle.setAttribute(
            "aria-expanded",
            !menuLinks.hidden
        );
    });
    </script>
    <script>
        const form = document.getElementById("disease-form");
        const backButton = document.querySelector(".back-button");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            setTimeout(function() {
                if (validateForm()) {
                window.location.href = "submission.html";
                }
            }, 3000);
        });

        backButton.addEventListener("click", function() {
            window.location.href = "homepage.html";
        });
    </script>
</body>
</html>
